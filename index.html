
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>RunTrack – Smart Walking, Jogging & Running Tracker</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Track your walking, jogging and running workouts with RunTrack. Monitor distance, speed, pace, calories and workout progress with GPS tracking and voice alerts."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="RunTrack, running tracker, walking tracker, jogging app, GPS fitness tracker, distance tracker, pace tracker, workout tracker"
    />

    <meta name="author" content="RunTrack" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: current Vercel address -->
    <link
      rel="canonical"
      href="https://runtrack-bay.vercel.app/"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#c2185b" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RunTrack – Your Smart Fitness Tracker" />
    <meta
      property="og:description"
      content="Track your walking, jogging and running workouts with RunTrack. Monitor distance, pace, speed and calories."
    />
    <meta
      property="og:url"
      content="https://runtrack-bay.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://runtrack-bay.vercel.app/og-image.png"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RunTrack – Your Smart Fitness Tracker"
    />
    <meta
      name="twitter:description"
      content="Track your walking, jogging and running workouts with RunTrack."
    />
    <meta
      name="twitter:image"
      content="https://runtrack-bay.vercel.app/og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
