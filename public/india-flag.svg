<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Saffron -->
  <rect width="900" height="200" fill="#FF9933"/>

  <!-- White -->
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>

  <!-- Green -->
  <rect y="400" width="900" height="200" fill="#138808"/>

  <!-- Ashoka Chakra -->
  <g transform="translate(450 300)" fill="#000080" stroke="#000080">
    <!-- Outer ring -->
    <circle r="60" fill="none" stroke-width="8"/>

    <!-- Center -->
    <circle r="7" stroke="none"/>

    <!-- 24 spokes -->
    <g stroke-width="3">
      <line x1="0" y1="-7" x2="0" y2="-56"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(15)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(30)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(45)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(60)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(75)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(90)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(105)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(120)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(135)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(150)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(165)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(180)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(195)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(210)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(225)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(240)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(255)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(270)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(285)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(300)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(315)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(330)"/>
      <line x1="0" y1="-7" x2="0" y2="-56" transform="rotate(345)"/>
    </g>
  </g>
